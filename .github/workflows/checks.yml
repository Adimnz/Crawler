name: Research integrity and lifecycle checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Frontend research and connection regressions
        run: node --test tests/research.test.cjs tests/connection.test.cjs tests/recommendations-ui.test.cjs tests/client-capacity.test.cjs
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          CRAWLER_AUTO_AI: 'false'
          OPENAI_API_KEY: ''
          OPENAI_MODEL: ''
          DATABASE_URL: ''
          S3_BUCKET: ''



